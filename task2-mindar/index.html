<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Задание 2 - AR Меню столовой</title>
    <!-- Подключение библиотек A-Frame и MindAR Image Tracking через CDN -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- Инициализация AR-сцены и привязка файла маркера меню -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;"
             color-space="sRGB"
             renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
             
        <a-assets>
            <!-- Предзагрузка 3D-модели блюда -->
            <a-asset-item id="dishModel" src="./model.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Трекер маркера меню -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Освещение сцены -->
            <a-light type="ambient" color="#FFF" intensity="0.9"></a-light>
            <a-light type="directional" position="1 2 1" intensity="1.1"></a-light>

            <!-- 3D-модель горячего блюда столовой -->
            <a-gltf-model 
                src="#dishModel"
                rotation="0 0 0"
                position="0 0 0.1"
                scale="0.8 0.8 0.8">
            </a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
