<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Задание 4 - Размещение столика</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div id="info">Наведите камеру на пол и коснитесь экрана, чтобы поставить столик</div>

    <!-- Подключение Three.js и официального модуля ARButton -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        init();

        // 3D-модель круглого столика ресторана
        function createTable() {
            const table = new THREE.Group();

            // Столешница
            const top = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.25, 0.02, 32),
                new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.3 })
            );
            top.position.y = 0.45;
            table.add(top);

            // Ножка столика
            const leg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.025, 0.025, 0.44, 16),
                new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 })
            );
            leg.position.y = 0.22;
            table.add(leg);

            // Основание столика
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.18, 0.18, 0.015, 32),
                new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 })
            );
            base.position.y = 0.01;
            table.add(base);

            return table;
        }

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Освещение сцены
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2.5);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 2.0);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);

            // Рендерер с поддержкой WebXR
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Официальная кнопка Three.js для входа в AR
            document.body.appendChild(ARButton.createButton(renderer, {
                requiredFeatures: ['hit-test']
            }));

            // Размещение столика по касанию экрана (событие select)
            function onSelect() {
                if (reticle.visible) {
                    const table = createTable();
                    reticle.matrix.decompose(table.position, table.quaternion, table.scale);
                    scene.add(table);
                }
            }

            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // Кольцо-прицел (reticle) для поиска пола через hit-test
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xea580c })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Цикл анимации и hit-test
        function animate(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then(function (referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
                            hitTestSource = source;
                        });
                    });

                    session.addEventListener('end', function () {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });

                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
