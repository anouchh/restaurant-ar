<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Задание 3 - Колпак шеф-повара</title>
    <!-- Подключаем A-Frame и MindAR Face Tracking -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <style>
        html, body {
            position: relative;
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #info-overlay {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div id="info-overlay">Направьте фронтальную камеру на лицо</div>

    <!-- Инициализация AR-сцены с Face Tracking -->
    <a-scene mindar-face vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <!-- 3D-модель колпака шеф-повара -->
            <a-asset-item id="hatModel" src="./chef_hat.glb"></a-asset-item>
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- Освещение сцены -->
        <a-light type="ambient" color="#FFFFFF" intensity="0.9"></a-light>
        <a-light type="directional" position="0 2 1" intensity="1.2"></a-light>

        <!-- Точка 10 — верх лба / макушка головы для головных уборов -->
        <a-entity mindar-face-target="anchorIndex: 10">
            <a-gltf-model 
                src="#hatModel" 
                rotation="0 0 0" 
                position="0 0.15 -0.05" 
                scale="0.35 0.35 0.35">
            </a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
